[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torob-intelligence"
version = "1.0.0"
description = "Torob Evidence-Driven Price, Inventory and Shop Reliability Intelligence Engine"
authors = [{ name = "Starcoach Hackathon Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "duckdb>=0.10.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
